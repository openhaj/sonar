<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 74 36" role="img" aria-label="A blue plush shark swimming">
  <style>
    .blue    { fill: #6996AD; }
    .white   { fill: #FFF; }
    .outline { fill: none; stroke: #4F7D94; stroke-width: 0.4; stroke-linejoin: round; stroke-linecap: round; }
    .belly-outline { fill: none; stroke: #D5DEE3; stroke-width: 0.4; stroke-linecap: round; }
    .gills   { fill: none; stroke: #000; stroke-width: 0.35; stroke-linecap: round; }
    .eye     { fill: #000; stroke: #7B3F00; stroke-width: 0.4; }
    .mouth   { fill: #FF91A4; }
    @media (prefers-reduced-motion: no-preference) {
      .swim { animation: bob 4s ease-in-out infinite; transform-origin: 37px 20px; }
      .tail { animation: wag 2s ease-in-out infinite; transform-origin: 16px 23px; }
    }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-1.5px) rotate(1deg); } }
    @keyframes wag { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  </style>
  <g class="swim">
    <!-- tail fin: animated separately. Its base extends inside the body -->
    <g class="tail">
      <path class="blue" d="M 16 20 C 13 15 6 12 5 13 C 4 14 10 17 10 21 C 10 25 2 27 3 28 C 4 29 12 28 15 26 L 19.5 26.8 L 19.5 21 Z"/>
      <path class="outline" d="M 16 20 C 13 15 6 12 5 13 C 4 14 10 17 10 21 C 10 25 2 27 3 28 C 4 29 12 28 15 26"/>
    </g>

    <!-- body: back, dorsal fin, second dorsal, belly line -->
    <path class="blue" d="M 71 19 C 70 14 55 15 49 14 C 46 13 42 4 38 5 C 36 6 40 9 39 15 C 37 16 34 18 27 19 C 25 17 24 17 24 19 C 21 20 17 21 16 20 L 15 26 C 18 28 24 30 29 31 C 27 29 60 22 70 23 C 71 22 71 21 71 19 Z"/>
    <path class="outline" d="M 16 20 C 17 21 21 20 24 19 C 24 17 25 17 27 19 C 34 18 37 16 39 15 C 40 9 36 6 38 5 C 42 4 46 13 49 14 C 55 15 70 14 71 19 C 71 21 71 22 70 23 M 15 26 C 18 28 24 30 29 31"/>

    <!-- belly -->
    <path class="white" d="M 29 31 C 27 29 60 22 70 23 C 65 30 60 32 49 33 L 42 33 C 39 33 33 32 29 31 Z"/>
    <path class="belly-outline" d="M 70 23 C 65 30 60 32 49 33 M 42 33 C 39 33 33 32 29 31"/>

    <!-- pelvic fin -->
    <path class="blue" d="M 49 33 C 47 35 43 36 41 36 C 40 35 41 34 42 33 L 49.5 32.6 Z"/>
    <path class="outline" d="M 49 33 C 47 35 43 36 41 36 C 40 35 41 34 42 33"/>

    <!-- pectoral = -->
    <g transform="translate(0 -0.4)">
      <path class="blue" d="M 50 25 C 48 29 38 38 33 36 C 32 34 39 29 41 27 L 41.5 26 L 50.5 24.2 Z"/>
      <path class="outline" d="M 50 25 C 48 29 38 38 33 36 C 32 34 39 29 41 27"/>
    </g>

    <!-- gills: largest on the right, shrinking toward the left -->
    <path class="gills" d="M 58.4 23.63 C 57.44 21.63 57.44 19.63 58.4 17.63 M 56.6 23.87 C 55.75 22.11 55.75 20.34 56.6 18.57 M 54.8 24.14 C 54.06 22.60 54.06 21.07 54.8 19.54 M 53.0 24.42 C 52.38 23.12 52.38 21.82 53.0 20.52 M 51.2 24.72 C 50.69 23.65 50.69 22.58 51.2 21.52"/>

    <!-- mouth -->
    <path class="mouth" d="M 67.522 26.121 C 65 26 60 27 60 28 C 60 29 63 29 64 29 Z"/>
    <!-- teeth -->
    <path class="white" d="M 60 28 C 61 29 62 28 62 27 C 63 28 64 28 63.977 26.41 C 65 28 66 27 66.22 26.121 C 66 27 67 27 67.522 26.121 C 65 26 60 27 60 28 Z"/>

    <!-- eye -->
    <path class="eye" d="M 61 20 C 60 22 64 21 64 20 C 65 19 62 19 61 20 Z"/>
    <circle class="white" cx="62.4" cy="19.9" r="0.45"/>
  </g>
</svg>
